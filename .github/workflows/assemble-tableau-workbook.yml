name: Assemble Tableau workbook
on:
  push:
    paths:
      - "dashboard/.twbx_upload/COMPLETE"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate packaged workbook
        shell: bash
        run: |
          set -euo pipefail
          cat dashboard/.twbx_upload/part-* > /tmp/workbook.b64
          base64 --decode /tmp/workbook.b64 > dashboard/Ad_Performance_Intelligence.twbx
          unzip -t dashboard/Ad_Performance_Intelligence.twbx
          rm -rf dashboard/.twbx_upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dashboard
          git commit -m "Add packaged Tableau workbook [skip ci]"
          git push
